name = "istanbulbizim"
main = "src/bundle.js"
compatibility_date = "2026-10-05"

# The website: Flutter app compiled to WebAssembly (python3 build.py --web).
# Static files are served before the Worker runs; API routes (/buses, /line, /tile/*, …) fall through to it.
[assets]
directory = "./mobile_app/build/web"
binding = "ASSETS"

[[kv_namespaces]]
binding = "LIVE"
id = "3c69b4e4e6264a52909affe5116b373c"

[triggers]
crons = ["*/1 * * * *"]

# TransitHub: one Durable Object holding the live fleet, timetables, cancellations and network
# changes (SQLite storage; available on the Workers Free plan). Replaces per-minute KV writes.
[[durable_objects.bindings]]
name = "HUB"
class_name = "TransitHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TransitHub"]
