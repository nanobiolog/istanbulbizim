<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="İstanbul Bizim — İETT otobüsleri, Marmaray, metro, tramvay ve vapurlar tek haritada: canlı konumlar, tarifeler, istasyon katları ve 3D istasyon içi yürüyüş.">
  <meta name="theme-color" content="#0B1220">
  <meta name="color-scheme" content="dark light">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="İstanbul Bizim">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta property="og:title" content="İstanbul Bizim">
  <meta property="og:description" content="İstanbul'un otobüs, raylı sistem ve vapur ağı canlı haritada.">

  <title>İstanbul Bizim</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B1220; overscroll-behavior: none; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; color: #E2E8F0; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #splash .logo { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: #fff; }
    #splash .lines { display: flex; gap: 6px; }
    #splash .lines i { width: 26px; height: 6px; border-radius: 3px; animation: pulse 1.2s ease-in-out infinite; }
    #splash .lines i:nth-child(2) { animation-delay: .15s } #splash .lines i:nth-child(3) { animation-delay: .3s }
    #splash .lines i:nth-child(4) { animation-delay: .45s } #splash .lines i:nth-child(5) { animation-delay: .6s }
    @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
    #splash small { color: #94A3B8; font-weight: 500; }
  </style>
</head>
<body>
  <div id="splash" aria-live="polite">
    <div class="logo">İstanbul Bizim</div>
    <div class="lines">
      <i style="background:#2E5AAC"></i><i style="background:#009944"></i><i style="background:#EE3124"></i><i style="background:#E91E76"></i><i style="background:#0B5CAD"></i>
    </div>
    <small>Otobüs · Marmaray · Metro · Tramvay · Vapur</small>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
